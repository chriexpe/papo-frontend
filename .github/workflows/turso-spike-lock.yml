name: turso-spike-lock

on:
  push:
    branches:
      - spike/turso-local-cache

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: spike/turso-local-cache
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Generate lockfile with the PR7 dependency
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: lock Turso spike dependencies"
          git push origin HEAD:spike/turso-local-cache
