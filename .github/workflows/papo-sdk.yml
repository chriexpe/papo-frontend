name: papo-sdk

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  sdk:
    name: SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install protocol-check YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Check SDK boundaries, format, Clippy, docs, tests and build
        shell: bash
        run: bash scripts/papo-sdk-check.sh

  android-proof:
    name: SDK (Android emulator proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-linux-android
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-emulator-proof
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk and project Android SDK
        run: |
          cargo install cargo-ndk --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" "platforms;android-37.2"
      - name: Check proof formatting and build instrumentation APKs
        run: |
          ./android/gradlew -p android :sdk-proof:checkSdkProofFormatting \
            :sdk-proof:assembleDebug :sdk-proof:assembleDebugAndroidTest --console=plain
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove worker callbacks and main-thread SnapshotStateList on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/papo-sdk-emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papo-sdk-instrumentation-results
          path: android/sdk-proof/build/reports/instrumentation.txt
          if-no-files-found: warn

  android:
    name: SDK (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android
          components: clippy
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-android-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk and project NDK
        run: |
          cargo install cargo-ndk --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - name: Build all SDK crates and arm64 binding library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a --platform 31 build --locked \
            -p papo-api -p papo-sdk -p papo-sdk-ui -p papo-ffi -p papo-test-server
          cargo ndk -t arm64-v8a --platform 31 clippy --locked \
            -p papo-api -p papo-sdk -p papo-sdk-ui -p papo-ffi -p papo-test-server --lib -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: papo-sdk-android-arm64
          path: target/aarch64-linux-android/debug/libpapo_ffi.so
          if-no-files-found: error

  postgres-protocol:
    name: SDK (PostgreSQL protocol)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: papo_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Read reviewed backend revision
        id: backend-pin
        shell: bash
        run: echo "commit=$(cat crates/sdk/api/protocol/backend-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: chriexpe/papo-backend
          ref: ${{ steps.backend-pin.outputs.commit }}
          path: .papo/backend-protocol
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .papo/backend-protocol/backend/go.mod
          cache-dependency-path: .papo/backend-protocol/backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-postgres-protocol
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check pinned backend protocol drift
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/papo-api-contract.py --backend .papo/backend-protocol
          python3 scripts/papo-api-events.py --backend .papo/backend-protocol
      - name: Generate an ephemeral proof password
        shell: bash
        run: |
          password="A!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "PAPO_PROOF_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Verify ordering, bidirectional cursors and live example
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/papo_protocol?sslmode=disable
        run: python3 scripts/papo-backend-proof.py --backend .papo/backend-protocol
