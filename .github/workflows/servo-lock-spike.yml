name: servo-lock-spike

on:
  push:
    branches: [feat/webembed-linux-servo]
    paths:
      - Cargo.toml
      - .github/workflows/servo-lock-spike.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/webembed-linux-servo
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - name: Resolve Cargo.lock
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore(webembed): lock Servo Linux dependencies"
          git push
