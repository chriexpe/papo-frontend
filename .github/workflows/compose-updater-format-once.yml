name: compose-updater-format-once
on:
  push:
    branches: [feat/compose-in-app-updates]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/compose-in-app-updates
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Format Compose sources
        run: ./android/gradlew -p android :compose:formatCompose --no-daemon --console=plain
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- android/compose; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- android/compose
            git commit -m 'style(android): apply Compose ktfmt'
            git push origin HEAD:feat/compose-in-app-updates
          fi
