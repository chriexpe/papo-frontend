name: papo-desktop

# The Rune desktop client is Linux-first: Windows and macOS join when the
# client runs there. The workspace manifest is watched because Rune's crate
# patches live in it.
on:
  pull_request:
    paths:
      - crates/papo-desktop/**
      - scripts/papo-desktop-check.sh
      - .github/workflows/papo-desktop.yml
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [main]
    paths:
      - crates/papo-desktop/**
      - scripts/papo-desktop-check.sh
      - .github/workflows/papo-desktop.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CLIPPY_TOOLCHAIN: 1.99.1

jobs:
  papo-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: papo-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check papo-desktop
        shell: bash
        run: bash scripts/papo-desktop-check.sh
