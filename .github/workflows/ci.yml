name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev \
            libfontconfig1-dev pkg-config
      # `cargo fmt --check` ainda não: o repositório nunca passou pelo rustfmt e
      # o acerto é um commit à parte, só de formatação.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # O `stable` do runner some por baixo dos pés: uma dependência que suba o
  # mínimo dela passaria batido aqui e só quebraria na máquina de quem
  # instala. Este job compila exatamente com o rust-version do Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install
      - run: cargo build --locked

  # Os nomes de pacote em scripts/deps.sh são promessa feita a quem instala.
  # Este job prova que os do apt existem de verdade, sem baixar nada.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          ./scripts/deps.sh | tail -3 | grep sudo | sed 's/^ *//' \
            | sed 's/install -y/install -y --dry-run/' | sh

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar .desktop e AppStream
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          desktop-file-validate packaging/io.github.chriexpe.Papo.desktop
          appstreamcli validate --no-net \
            packaging/io.github.chriexpe.Papo.metainfo.xml
