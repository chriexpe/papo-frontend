name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep shared dependency caches small; PRs only restore main's caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # O clippy ganha lints novos a cada versão do Rust. Com `stable` o portão
  # vira uma bomba-relógio: a cada seis semanas um repositório em que
  # ninguém mexeu fica vermelho. A versão que barra o merge é fixa e sobe
  # quando alguém decide subir; o job `clippy-novo` avisa do que vem por aí
  # sem derrubar nada.
  CLIPPY_TOOLCHAIN: 1.98.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test winit preparation
        run: python -B -m unittest discover -s tests -p 'test_prepare_winit.py'
      - run: cargo test --locked --workspace

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Avisa dos lints que a próxima versão do Rust vai cobrar. Falhar aqui não
  # barra nada: serve para o aviso chegar antes de virar problema.
  clippy-novo:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # O `stable` do runner some por baixo dos pés: uma dependência que suba o
  # mínimo dela passaria batido e só quebraria na máquina de quem instala.
  # Este job compila exatamente com o rust-version do Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace

  # Os nomes de pacote em scripts/deps.sh são promessa feita a quem instala.
  # Este job prova que os do apt existem de verdade, sem baixar nada.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          ./scripts/deps.sh --command \
            | sed 's/install -y/install -y --dry-run/' | sh
      - name: Validar scripts de shell
        run: |
          bash -n scripts/deps.sh
          bash -n scripts/ci-install-linux-deps.sh
          bash -n scripts/wpe-runtime.sh
          bash -n packaging/macos/build-app.sh
          python3 -m py_compile packaging/macos/bundle-gstreamer.py

  # Build natively on an Apple Silicon runner. This is a compile/runtime
  # bootstrap, not yet a signed .app or a distributable macOS release.
  macos:
    runs-on: macos-15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - uses: ./.github/actions/prepare-winit
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native GStreamer SDK
        run: |
          # Homebrew's current gstreamer formula bundles the former gst-* plugins.
          brew install gstreamer libnice-gstreamer pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig" >> "$GITHUB_ENV"
          gst-inspect-1.0 webrtcbin
          gst-inspect-1.0 nicesrc
      - name: Check macOS code and tests for warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile macOS desktop application and native WebKit bridge
        run: cargo build --locked --bin papo
      - name: Test WKWebView geometry contract
        run: cargo test --locked --bin papo --lib point_conversion_is_scaled_once
      - name: Test macOS launch-at-login plist
        run: cargo test --locked --lib launchagent_escapes_paths_and_uses_array_arguments
      - name: Check native media runtime without GUI hardware
        run: |
          ./target/debug/papo voice-check | tee voice-check.log
          grep -q "GStreamer" voice-check.log
      - name: Package self-contained Finder-launchable test app
        run: |
          version="$(grep -m1 '^version = "' Cargo.toml | cut -d '"' -f2)"
          bash packaging/macos/build-app.sh target/debug/papo "$version" dist
          file dist/Papo.app/Contents/MacOS/papo
          test "$(lipo -archs dist/Papo.app/Contents/MacOS/papo)" = "arm64"
          test -d dist/Papo.app/Contents/Frameworks
          test -f dist/Papo.app/Contents/PlugIns/libgstnice.dylib
          test -f dist/Papo.app/Contents/Helpers/gst-plugin-scanner
          # Invalid nested folders under Contents/PlugIns break codesign.
          test -z "$(find dist/Papo.app/Contents/PlugIns -mindepth 1 -maxdepth 1 -type d -print -quit)"
          env GST_PLUGIN_PATH_1_0=/dev/null GST_PLUGIN_SYSTEM_PATH_1_0=/dev/null \
            dist/Papo.app/Contents/MacOS/papo voice-check | tee packaged-voice-check.log
          grep -q "GStreamer" packaged-voice-check.log
          grep -Eq '\[ok\] +webrtcbin' packaged-voice-check.log
          grep -Eq '\[ok\] +nicesrc' packaged-voice-check.log
          grep -Eq '\[ok\] +osxaudiosrc' packaged-voice-check.log
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Papo.app Papo-macos-arm64-adhoc.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: papo-macos-arm64-adhoc
          path: dist/Papo-macos-arm64-adhoc.zip
          retention-days: 7
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - uses: ./.github/actions/prepare-winit
      - name: Test winit preparation on Windows
        run: python -B -m unittest discover -s tests -p 'test_prepare_winit.py'
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GStreamer SDK
        shell: pwsh
        run: |
          choco install gstreamer gstreamer-devel --version=1.26.9 -y --no-progress
          $candidates = @(
            'C:\Program Files\gstreamer\1.0\msvc_x86_64',
            'C:\gstreamer\1.0\msvc_x86_64'
          )
          $root = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) {
            throw "GStreamer SDK not found in expected install locations"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Check native Windows build
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: actions/cache@v4
        with:
          path: rsrpc-build
          key: rsrpc-${{ runner.os }}-x86_64-${{ hashFiles('packaging/rsrpc/REVISION') }}

      - name: Build rsRPC helper
        shell: pwsh
        run: |
          if (-not (Test-Path rsrpc-build/bin/rsrpc.exe)) {
            $revision = (Get-Content packaging/rsrpc/REVISION -Raw).Trim()
            cargo install --locked --git https://github.com/pog5/rsrpc.git --rev $revision --root rsrpc-build rsrpc
            if ($LASTEXITCODE -ne 0) { throw 'rsRPC build failed' }
          }
          Copy-Item rsrpc-build/bin/rsrpc.exe rsrpc.exe
      - name: Build and smoke-test self-contained bundle
        shell: pwsh
        run: |
          cargo build --locked
          ./packaging/windows/bundle.ps1 `
            -GStreamerRoot $env:GSTREAMER_ROOT `
            -PapoExe target/debug/papo.exe `
            -RsRpcExe rsrpc.exe `
            -OutputDir papo-windows-smoke

          $gstBin = Join-Path $env:GSTREAMER_ROOT 'bin'
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and $_.TrimEnd('\') -ne $gstBin.TrimEnd('\')
          }) -join ';'

          $check = & '.\papo-windows-smoke\papo.exe' voice-check 2>&1 | Out-String
          Write-Host $check
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled papo.exe voice-check failed with exit code $LASTEXITCODE"
          }
          if ($check -notmatch 'GStreamer') {
            throw 'Bundled Papo did not initialize GStreamer'
          }
          if (-not (Test-Path '.\papo-windows-smoke\rsrpc.exe')) {
            throw 'Bundled Windows artifact is missing rsrpc.exe'
          }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 `
            -GStreamerRoot $env:GSTREAMER_ROOT `
            -PapoExe target/debug/papo.exe `
            -RsRpcExe rsrpc.exe `
            -Version ci `
            -OutputDir installer-out

      - name: Upload Windows test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: papo-windows-smoke
          path: |
            papo-windows-smoke
            installer-out/Papo-ci-Setup.exe
          if-no-files-found: error

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validar .desktop e AppStream
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          desktop-file-validate packaging/io.github.chriexpe.Papo.desktop
          appstreamcli validate --no-net \
            packaging/io.github.chriexpe.Papo.metainfo.xml
