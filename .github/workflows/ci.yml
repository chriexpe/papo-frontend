name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # O clippy ganha lints novos a cada versão do Rust. Com `stable` o portão
  # vira uma bomba-relógio: a cada seis semanas um repositório em que
  # ninguém mexeu fica vermelho. A versão que barra o merge é fixa e sobe
  # quando alguém decide subir; o job `clippy-novo` avisa do que vem por aí
  # sem derrubar nada.
  CLIPPY_TOOLCHAIN: 1.98.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install
      - run: cargo test --locked --workspace

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Avisa dos lints que a próxima versão do Rust vai cobrar. Falhar aqui não
  # barra nada: serve para o aviso chegar antes de virar problema.
  clippy-novo:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # O `stable` do runner some por baixo dos pés: uma dependência que suba o
  # mínimo dela passaria batido e só quebraria na máquina de quem instala.
  # Este job compila exatamente com o rust-version do Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install
      - run: cargo build --locked --workspace

  # Os nomes de pacote em scripts/deps.sh são promessa feita a quem instala.
  # Este job prova que os do apt existem de verdade, sem baixar nada.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          ./scripts/deps.sh --command \
            | sed 's/install -y/install -y --dry-run/' | sh
      - name: Validar scripts de shell
        run: |
          bash -n scripts/deps.sh
          bash -n scripts/wpe-runtime.sh

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Install GStreamer SDK
        shell: pwsh
        run: |
          choco install gstreamer gstreamer-devel --version=1.26.9 -y --no-progress
          $candidates = @(
            'C:\Program Files\gstreamer\1.0\msvc_x86_64',
            'C:\gstreamer\1.0\msvc_x86_64'
          )
          $root = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) {
            throw "GStreamer SDK not found in expected install locations"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check native Windows build
        run: cargo check --locked --workspace
      - name: Build and smoke-test self-contained bundle
        shell: pwsh
        run: |
          cargo build --locked
          ./packaging/windows/bundle.ps1 `
            -GStreamerRoot $env:GSTREAMER_ROOT `
            -PapoExe target/debug/papo.exe `
            -OutputDir papo-windows-smoke

          $gstBin = Join-Path $env:GSTREAMER_ROOT 'bin'
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and $_.TrimEnd('\') -ne $gstBin.TrimEnd('\')
          }) -join ';'

          $check = & '.\papo-windows-smoke\papo.exe' voice-check 2>&1 | Out-String
          Write-Host $check
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled papo.exe voice-check failed with exit code $LASTEXITCODE"
          }
          if ($check -notmatch 'GStreamer') {
            throw 'Bundled Papo did not initialize GStreamer'
          }

  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validar .desktop e AppStream
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          desktop-file-validate packaging/io.github.chriexpe.Papo.desktop
          appstreamcli validate --no-net \
            packaging/io.github.chriexpe.Papo.metainfo.xml
