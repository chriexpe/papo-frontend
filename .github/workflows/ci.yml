name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep shared dependency caches small; PRs only restore main's caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # O clippy ganha lints novos a cada versão do Rust. Com `stable` o portão
  # vira uma bomba-relógio: a cada seis semanas um repositório em que
  # ninguém mexeu fica vermelho. A versão que barra o merge é fixa e sobe
  # quando alguém decide subir; o job `clippy-novo` avisa do que vem por aí
  # sem derrubar nada.
  CLIPPY_TOOLCHAIN: 1.99.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --workspace --exclude papo-desktop

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --exclude papo-desktop --all-targets -- -D warnings

  # Avisa dos lints que a próxima versão do Rust vai cobrar. Falhar aqui não
  # barra nada: serve para o aviso chegar antes de virar problema.
  clippy-novo:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --exclude papo-desktop --all-targets -- -D warnings

  # O `stable` do runner some por baixo dos pés: uma dependência que suba o
  # mínimo dela passaria batido e só quebraria na máquina de quem instala.
  # Este job compila exatamente com o rust-version do Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Dependências de sistema
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --exclude papo-desktop

  # Os nomes de pacote em scripts/deps.sh são promessa feita a quem instala.
  # Este job prova que os do apt existem de verdade, sem baixar nada.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          ./scripts/deps.sh --command \
            | sed 's/install -y/install -y --dry-run/' | sh
      - name: Validar scripts de shell
        run: |
          bash -n scripts/deps.sh
          bash -n scripts/ci-install-linux-deps.sh
          bash -n scripts/papo-desktop-check.sh
