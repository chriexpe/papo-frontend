name: android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep separate PRs independent, but stop rebuilding superseded PR commits.
# Main builds finish so they can publish caches reusable by every PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI needs the same code and optimization, without multi-GB Rust symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  compose-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check Compose formatting
        run: ./android/gradlew -p android :compose:checkComposeFormatting --no-daemon --console=plain

  android-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Ensure project NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - name: Check Android Rust cfg/JNI
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          cargo ndk -t arm64-v8a --platform 31 clippy --locked -p papo-android --lib -- -D warnings

  android-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only the full Compose build publishes Gradle caches, from main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-compose
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk and Android SDK
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" "platforms;android-37.2"
      - name: Build native Compose APK and run lint
        env:
          PAPO_COMPOSE_FIREBASE_APP_ID: ${{ secrets.PAPO_COMPOSE_FIREBASE_APP_ID }}
          PAPO_FIREBASE_API_KEY: ${{ secrets.PAPO_FIREBASE_API_KEY }}
          PAPO_FIREBASE_PROJECT_ID: ${{ secrets.PAPO_FIREBASE_PROJECT_ID }}
          PAPO_FIREBASE_SENDER_ID: ${{ secrets.PAPO_FIREBASE_SENDER_ID }}
          PAPO_COMPOSE_REQUIRE_FIREBASE: ${{ secrets.PAPO_COMPOSE_FIREBASE_APP_ID != '' && '1' || '0' }}
          PAPO_GIPHY_API_KEY: ${{ secrets.PAPO_GIPHY_API_KEY }}
        run: ./android/gradlew -p android :compose:assembleDebug :compose:lintDebug :compose:testDebugUnitTest -PpapoAbis=arm64-v8a,x86_64 --console=plain

  android-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check portable Compose build entry point
        run: python3 -B -m unittest discover -s tests -p 'test_android_compose_script.py'
