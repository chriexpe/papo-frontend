name: release

# A `v*` tag builds the signed Android APK and publishes it. Desktop packages
# return with the Rune client's packaging slice. A manual run builds the APK
# without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
          cargo install cargo-ndk --locked

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for tagged Android releases" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/papo-release.jks"

      - name: Build signed Android APK
        env:
          PAPO_ANDROID_KEYSTORE: ${{ runner.temp }}/papo-release.jks
          PAPO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PAPO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAPO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A release exige FCM: o Gradle falha se algum destes faltar.
          PAPO_REQUIRE_FIREBASE: "1"
          PAPO_FIREBASE_APP_ID: ${{ secrets.PAPO_FIREBASE_APP_ID }}
          PAPO_FIREBASE_API_KEY: ${{ secrets.PAPO_FIREBASE_API_KEY }}
          PAPO_FIREBASE_PROJECT_ID: ${{ secrets.PAPO_FIREBASE_PROJECT_ID }}
          PAPO_FIREBASE_SENDER_ID: ${{ secrets.PAPO_FIREBASE_SENDER_ID }}
          PAPO_GIPHY_API_KEY: ${{ secrets.PAPO_GIPHY_API_KEY }}
        run: |
          set -euo pipefail
          ./scripts/android-compose.sh --arm64 --release
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          apk="android/compose/build/outputs/apk/release/compose-release.apk"
          [ -f "$apk" ] || { echo "signed APK not produced" >&2; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ "$("$analyzer" manifest application-id "$apk")" = "io.github.chriexpe.papo" ]
          [ "$("$analyzer" manifest version-name "$apk")" = "$version" ]
          [ "$("$analyzer" manifest debuggable "$apk")" = "false" ]
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = set(apk.namelist())
          assert "lib/arm64-v8a/libpapo_compose.so" in files, "Missing Compose runtime"
          assert "lib/arm64-v8a/libpapo.so" not in files, "Legacy egui Android runtime was packaged"
          PY
          out="Papo-$version-android-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "ANDROID_APK=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: papo-android-arm64
          path: |
            ${{ env.ANDROID_APK }}
            ${{ env.ANDROID_APK }}.sha256

  publish:
    needs: android
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.apk.sha256
          generate_release_notes: true
