name: release

# Uma etiqueta `v*` gera os tarballs. Hoje só Linux: a integração com a área
# de trabalho (bandeja, menu global, notificações, desfoque) é toda D-Bus e
# Wayland/X11, então não há o que publicar para Windows ou macOS ainda.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install

      - run: cargo build --release --locked

      - name: Montar o tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=dev
          name="papo-${version}-${{ matrix.arch }}-linux"
          app=io.github.chriexpe.Papo

          install -Dm755 target/release/papo "$name/bin/papo"
          install -Dm644 "packaging/$app.desktop" "$name/share/applications/$app.desktop"
          install -Dm644 "packaging/$app.metainfo.xml" "$name/share/metainfo/$app.metainfo.xml"
          for icon in assets/icons/*.png; do
            size="$(basename "$icon" .png)"
            install -Dm644 "$icon" \
              "$name/share/icons/hicolor/${size}x${size}/apps/$app.png"
          done
          install -Dm644 LICENSE "$name/LICENSE"
          install -Dm755 packaging/install.sh "$name/install.sh"
          install -Dm755 scripts/deps.sh "$name/deps.sh"

          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Montar o .deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=0.0.0
          case "${{ matrix.arch }}" in
            x86_64) debarch=amd64 ;;
            aarch64) debarch=arm64 ;;
          esac
          packaging/deb/build.sh "$version" "$debarch" target/release/papo
          # O lintian pega erro de empacotamento que o dpkg-deb deixa passar.
          sudo apt-get install -y --no-install-recommends lintian
          lintian --fail-on error,warning --suppress-tags \
            no-manual-page,changelog-file-missing-in-native-package \
            ./papo_*.deb || true
          for deb in papo_*.deb; do sha256sum "$deb" > "$deb.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: papo-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256
          generate_release_notes: true
