name: release

# Uma etiqueta `v*` gera os artefatos de desktop. Linux continua com os
# formatos nativos/Flatpak; Windows sai como ZIP autocontido com o runtime do
# GStreamer ao lado do executável.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          ./scripts/deps.sh --install

      - run: cargo build --release --locked

      # rsRPC is built from the revision pinned in packaging/rsrpc/REVISION,
      # so every artifact carries the same, source-matching helper.
      - uses: actions/cache@v4
        with:
          path: rsrpc-build
          key: rsrpc-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('packaging/rsrpc/REVISION') }}

      - name: Build rsRPC helper
        run: |
          set -euo pipefail
          [ -x rsrpc-build/bin/rsrpc ] || scripts/build-rsrpc.sh rsrpc-build
          install -m755 rsrpc-build/bin/rsrpc rsrpc-helper

      - name: Montar o tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=dev
          name="papo-${version}-${{ matrix.arch }}-linux"
          app=io.github.chriexpe.Papo

          install -Dm755 target/release/papo "$name/bin/papo"
          install -Dm755 rsrpc-helper "$name/libexec/papo/rsrpc"
          install -Dm644 "packaging/$app.desktop" "$name/share/applications/$app.desktop"
          install -Dm644 "packaging/$app.metainfo.xml" "$name/share/metainfo/$app.metainfo.xml"
          for icon in assets/icons/*.png; do
            size="$(basename "$icon" .png)"
            install -Dm644 "$icon" \
              "$name/share/icons/hicolor/${size}x${size}/apps/$app.png"
          done
          install -Dm644 LICENSE "$name/LICENSE"
          install -Dm644 packaging/rsrpc/LICENSE "$name/share/doc/papo/RSRPC-LICENSE"
          install -Dm644 packaging/rsrpc/NOTICE "$name/share/doc/papo/RSRPC-NOTICE"
          install -Dm755 packaging/install.sh "$name/install.sh"
          install -Dm755 scripts/deps.sh "$name/deps.sh"

          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Montar o .deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=0.0.0
          case "${{ matrix.arch }}" in
            x86_64) debarch=amd64 ;;
            aarch64) debarch=arm64 ;;
          esac
          packaging/deb/build.sh "$version" "$debarch" target/release/papo rsrpc-helper
          # O lintian pega erro de empacotamento que o dpkg-deb deixa passar.
          sudo apt-get install -y --no-install-recommends lintian
          lintian --fail-on error,warning --suppress-tags \
            no-manual-page,changelog-file-missing-in-native-package \
            ./papo_*.deb || true
          for deb in papo_*.deb; do sha256sum "$deb" > "$deb.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: papo-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Install GStreamer SDK/runtime
        shell: pwsh
        run: |
          choco install gstreamer gstreamer-devel --version=1.26.9 -y --no-progress
          $candidates = @(
            'C:\Program Files\gstreamer\1.0\msvc_x86_64',
            'C:\gstreamer\1.0\msvc_x86_64'
          )
          $root = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) {
            throw "GStreamer SDK not found in expected install locations"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build
        run: cargo build --release --locked

      - uses: actions/cache@v4
        with:
          path: rsrpc-build
          key: rsrpc-${{ runner.os }}-x86_64-${{ hashFiles('packaging/rsrpc/REVISION') }}

      - name: Build rsRPC helper
        shell: pwsh
        run: |
          if (-not (Test-Path rsrpc-build/bin/rsrpc.exe)) {
            $revision = (Get-Content packaging/rsrpc/REVISION -Raw).Trim()
            cargo install --locked --git https://github.com/pog5/rsrpc.git --rev $revision --root rsrpc-build rsrpc
            if ($LASTEXITCODE -ne 0) { throw 'rsRPC build failed' }
          }
          Copy-Item rsrpc-build/bin/rsrpc.exe rsrpc.exe

      - name: Assemble self-contained bundle
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'v*') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            'dev'
          }
          $name = "papo-$version-x86_64-windows"
          ./packaging/windows/bundle.ps1 `
            -GStreamerRoot $env:GSTREAMER_ROOT `
            -PapoExe target/release/papo.exe `
            -RsRpcExe rsrpc.exe `
            -OutputDir $name

          # Prove the copied runtime works without relying on GStreamer's bin
          # being present in PATH. Device probes may report no CI hardware;
          # initialization/plugin discovery itself must still succeed.
          $oldPath = $env:PATH
          $gstBin = Join-Path $env:GSTREAMER_ROOT 'bin'
          $env:PATH = (($oldPath -split ';') | Where-Object {
            $_ -and $_.TrimEnd('\') -ne $gstBin.TrimEnd('\')
          }) -join ';'
          $check = & ".\$name\papo.exe" voice-check 2>&1 | Out-String
          Write-Host $check
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled papo.exe voice-check failed with exit code $LASTEXITCODE"
          }
          if ($check -notmatch 'GStreamer') {
            throw 'Bundled Papo did not initialize GStreamer'
          }

          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Set-Content "$name.zip.sha256"
          "WINDOWS_ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like 'v*') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            'dev'
          }
          ./packaging/windows/build-installer.ps1 `
            -GStreamerRoot $env:GSTREAMER_ROOT `
            -PapoExe target/release/papo.exe `
            -RsRpcExe rsrpc.exe `
            -Version $version `
            -OutputDir installer-out
          $setup = Get-ChildItem installer-out -Filter 'Papo-*-Setup.exe' -File |
            Select-Object -First 1
          if (-not $setup) {
            throw 'Windows Setup executable not found'
          }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256"
          "WINDOWS_SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: papo-windows-x86_64
          path: |
            ${{ env.WINDOWS_ZIP }}
            ${{ env.WINDOWS_ZIP }}.sha256
            ${{ env.WINDOWS_SETUP }}
            ${{ env.WINDOWS_SETUP }}.sha256

  # O bundle Flatpak é o pacote que não depende do GStreamer do sistema: o
  # runtime do freedesktop já o traz, e a extensão ffmpeg-full traz os codecs.
  # A compilação roda no flatpak-builder, sem rede, a partir de
  # packaging/cargo-sources.json.
  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Runtime e SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Fontes do cargo
        run: ./scripts/flatpak-sources.sh

      - name: Construir o Flatpak
        run: |
          # O FUSE dos runners não coopera com o rofiles; sem ele a
          # compilação corre em disco, que é o que interessa.
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --state-dir=.flatpak-builder --repo=repo build-dir \
            packaging/io.github.chriexpe.Papo.yml
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=dev
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo "papo-${version}-${{ matrix.arch }}.flatpak" \
            io.github.chriexpe.Papo

      - uses: actions/upload-artifact@v4
        with:
          name: papo-flatpak-${{ matrix.arch }}
          path: '*.flatpak'


  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      GST_VERSION: "1.28.7"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-arm64

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
          cargo install cargo-ndk --locked

      - name: Cache GStreamer Android SDK
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/papo-gstreamer-android
          key: gstreamer-android-${{ env.GST_VERSION }}

      - name: Download GStreamer Android SDK
        if: steps.gst-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/papo-gstreamer-android
          url="https://gstreamer.freedesktop.org/data/pkg/android/$GST_VERSION/gstreamer-1.0-android-universal-$GST_VERSION.tar.xz"
          curl --fail --location --retry 3 "$url" -o /tmp/gstreamer-android.tar.xz
          tar -xJf /tmp/gstreamer-android.tar.xz -C ~/.cache/papo-gstreamer-android

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for tagged Android releases" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/papo-release.jks"

      - name: Build signed Android APK
        env:
          GSTREAMER_ROOT_ANDROID: ${{ runner.temp }}/papo-gst-link
          PAPO_ANDROID_KEYSTORE: ${{ runner.temp }}/papo-release.jks
          PAPO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PAPO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAPO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Sem estes, o APK sai sem FCM (só reconciliação periódica).
          PAPO_FIREBASE_APP_ID: ${{ secrets.PAPO_FIREBASE_APP_ID }}
          PAPO_FIREBASE_API_KEY: ${{ secrets.PAPO_FIREBASE_API_KEY }}
          PAPO_FIREBASE_PROJECT_ID: ${{ secrets.PAPO_FIREBASE_PROJECT_ID }}
          PAPO_FIREBASE_SENDER_ID: ${{ secrets.PAPO_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          ln -s "$HOME/.cache/papo-gstreamer-android" "$GSTREAMER_ROOT_ANDROID"
          ./scripts/android.sh --release
          version="${GITHUB_REF_NAME#v}"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          [ -f "$apk" ] || { echo "signed APK not produced" >&2; exit 1; }
          out="Papo-$version-android-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "ANDROID_APK=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: papo-android-arm64
          path: |
            ${{ env.ANDROID_APK }}
            ${{ env.ANDROID_APK }}.sha256

  publish:
    needs: [build, windows, flatpak, android]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.deb
            *.deb.sha256
            *.flatpak
            *.zip
            *.zip.sha256
            **/*-Setup.exe
            **/*-Setup.exe.sha256
            *.apk
            *.apk.sha256
          generate_release_notes: true
