name: Prepare the winit patch
description: Prepare the checksum-verified source and apply the pinned Wayland diff
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: python scripts/prepare-winit.py
