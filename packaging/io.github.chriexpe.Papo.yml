# Manifesto Flatpak.
#
# O Flatpak é o alvo principal: o runtime já traz GStreamer e os codecs, o
# seletor de arquivos que já usamos é o xdg-desktop-portal, e o Flathub
# compila para x86_64 e aarch64 sozinho.
#
# As dependências do cargo precisam estar em disco antes da compilação, que
# roda sem rede. `scripts/flatpak-sources.sh` gera `cargo-sources.json` a
# partir do Cargo.lock; rode-o sempre que o lock mudar.
id: io.github.chriexpe.Papo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: papo

# Codecs que não cabem no runtime base (H.264 e companhia) entram por aqui.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

finish-args:
  # O cliente conversa com servidores na internet e na rede local.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tocar áudio e vídeo, gravar recado de voz e falar na call.
  - --socket=pulseaudio
  # A câmera fica de fora por enquanto — e de propósito. A captura é
  # `v4l2src`, que precisaria de `--device=all`, e `all` não é "a webcam":
  # é todo dispositivo da máquina. O caminho certo é o portal de câmera, que
  # entrega um fd do PipeWire só para a câmera; até ele chegar, no Flatpak a
  # call entra com voz e sem vídeo próprio (o vídeo dos outros aparece).
  # Ícone na bandeja (StatusNotifierItem) e o menu global do Plasma. O item
  # abre mão do nome próprio dentro do sandbox (ver `platform/tray.rs`), então
  # basta alcançar o watcher.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --own-name=com.canonical.dbusmenu
  # Contador de menções na barra de tarefas.
  - --talk-name=com.canonical.Unity.LauncherEntry
  - --talk-name=org.freedesktop.Notifications
  # Restaurar a janela minimizada no Plasma (scripts do KWin).
  - --talk-name=org.kde.KWin
  # Ler o tema, a cor de destaque e a fonte do sistema.
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=xdg-config/gtk-3.0:ro
  # Iniciar com a sessão: é em ~/.config/autostart que o ambiente procura.
  - --filesystem=xdg-config/autostart
  # Onde os anexos salvos vão parar por padrão; o resto passa pelo portal.
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/papo/cargo

modules:
  - name: papo
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/papo /app/bin/papo
      - install -Dm644 packaging/io.github.chriexpe.Papo.desktop
        /app/share/applications/io.github.chriexpe.Papo.desktop
      - install -Dm644 packaging/io.github.chriexpe.Papo.metainfo.xml
        /app/share/metainfo/io.github.chriexpe.Papo.metainfo.xml
      - for icon in assets/icons/*.png; do size="${icon##*/}"; size="${size%.png}";
        install -Dm644 "$icon"
        "/app/share/icons/hicolor/${size}x${size}/apps/io.github.chriexpe.Papo.png"; done
      - mkdir -p /app/lib/ffmpeg
    sources:
      - type: dir
        path: ..
        # O repositório inteiro é a fonte; sem isto o `.git`, o `target` e o
        # resultado da compilação anterior entrariam na cópia.
        skip:
          - .git
          - target
          - .flatpak-builder
          - build-dir
          - repo
      - cargo-sources.json
