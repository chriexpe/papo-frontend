[package]
name = "papo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cliente nativo do Papo — chat self-hosted"
license = "AGPL-3.0-or-later"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
directories = "6"
raw-window-handle = "0.6"
egui-phosphor = { version = "0.14", features = ["regular"] }
fontdb = { version = "0.23", default-features = false, features = ["fs"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
base64 = "0.22"
swash = "0.2"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", default-features = false }

[profile.release]
# Binário de distribuição: um arquivo só, sem símbolos de depuração.
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
