[workspace]
members = [
    "crates/papo-core",
    "crates/papo-android",
    "crates/papo-call",
    "crates/papo-desktop",
    "crates/sdk/api",
    "crates/sdk/core",
    "crates/sdk/ui",
    "crates/sdk/ffi",
    "crates/sdk/test-server",
    "tests/call-sfu/client",
]
resolver = "2"

# The release version. Android's Gradle build and the release workflow read
# the first `version = ` line of this file.
[workspace.package]
version = "0.9.0"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Rune's own patched copies of these crates. Cargo does not inherit a
# dependency's [patch], so every app that builds Rune repeats Rune's table.
# All of them, and papo-desktop's `rune` and `rune-i18n`, name the same
# revision; a bump changes them together (Rune's root Cargo.toml at the new
# revision lists what to patch). The revision is upstream `dev` plus the
# fixes Papo needs before upstream lands them, on the `papo` branch of
# chriexpe/rune; each fix's commit says when it can go.
[patch.crates-io]
winit = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
sctk-adwaita = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
parley_engine = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
wgpu-hal = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
accesskit_windows = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
accesskit_macos = { git = "https://github.com/chriexpe/rune", rev = "cd94e2b5e43dc5de3e0068123112a9c3b535f322" }
