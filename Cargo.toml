[package]
name = "papo"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Cliente nativo do Papo — chat self-hosted"
license = "AGPL-3.0-or-later"

[workspace]
members = ["crates/papo-core"]
resolver = "2"

# O Android carrega uma biblioteca, não executa um binário: o sistema abre a
# Activity e ela faz `dlopen` no `.so`, que precisa exportar `android_main`.
# Por isso o que existe de verdade é a biblioteca — o binário da área de
# trabalho é uma casca fina por cima dela (`src/main.rs`).
[lib]
name = "papo"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "papo"
path = "src/main.rs"

[dependencies]
papo-core = { path = "crates/papo-core" }
# As features de janela são por plataforma: Wayland/X11 só no Linux e
# `android-game-activity` só no Android. Os dois back-ends de Activity do
# eframe são exclusivos — nunca ligar os dois.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
raw-window-handle = "0.6"
egui-phosphor = { version = "0.14", features = ["regular"] }
fontdb = { version = "0.23", default-features = false, features = ["fs"] }
base64 = "0.22"
swash = "0.2"

# ---------------------------------------------------------------------------
# Área de trabalho
# ---------------------------------------------------------------------------
# GStreamer, bandeja, menu global, diálogos do portal e as pastas do XDG só
# existem aqui. No Android cada um desses tem um substituto em `stub/`.
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
directories = "6"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# Voz e vídeo: o webrtcbin faz ICE, DTLS-SRTP e o transporte; a sinalização
# (oferta, resposta e candidatos) vai pelo mesmo WebSocket do resto.
gstreamer-webrtc = "0.24"
gstreamer-sdp = "0.24"
# `v1_20` abre a API de extensão de cabeçalho RTP (o nível de voz, RFC 6464,
# é o que diz ao servidor quem está falando). O elemento correspondente
# também só existe do GStreamer 1.20 em diante.
gstreamer-rtp = { version = "0.24", features = ["v1_20"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }
wayland-protocols = { version = "0.32", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", default-features = false }
# WPE WebKit is loaded from a staged runtime at run time; Papo does not link
# GTK/WebKit at build time. The bridge ABI is the narrow Rust-facing contract.
libloading = "0.8"

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["android-game-activity"] }
# A mesma versão que o winit usa: o `AndroidApp` que chega no `android_main`
# tem de ser o tipo do winit, não um homônimo de outra versão.
android-activity = { version = "0.6", features = ["game-activity"] }
# `println!` não vai a lugar nenhum no Android; o que se lê é o logcat.
android_logger = "0.15"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# A call: o mesmo motor da área de trabalho, com as mesmas dependências.
gstreamer-webrtc = "0.24"
gstreamer-sdp = "0.24"
gstreamer-rtp = { version = "0.24", features = ["v1_20"] }
# O texto do teclado chega da Activity como uma `String` do Java, e ler isso
# pede o JNI. É a única coisa que falamos com o Java diretamente.
jni = "0.21"

[profile.release]
# Binário de distribuição: um arquivo só, sem símbolos de depuração.
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
