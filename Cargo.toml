[workspace]
members = [
    "crates/papo-core",
    "crates/papo-android",
    "crates/papo-call",
    "crates/papo-desktop",
    "crates/sdk/api",
    "crates/sdk/core",
    "crates/sdk/ui",
    "crates/sdk/ffi",
    "crates/sdk/test-server",
]
resolver = "2"

# The release version. Android's Gradle build and the release workflow read
# the first `version = ` line of this file.
[workspace.package]
version = "0.9.0"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
