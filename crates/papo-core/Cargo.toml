[package]
name = "papo-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Núcleo multiplataforma do cliente Papo"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
thiserror = "2"
log = "0.4"
base64 = "0.22"

# Engine of the production `ClientDb` cache. Pinned to the exact 0.8
# prerelease qualified by PR #29; the pin is deliberate, not a floating semver
# range. Public mimalloc/FTS defaults stay off. The unused `turso_sdk_kit`
# cdylibs this pulls into Android builds are excluded in `android/app`.
turso = { version = "=0.8.0-pre.12", default-features = false }
