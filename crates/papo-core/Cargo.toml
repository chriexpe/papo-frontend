[package]
name = "papo-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Núcleo multiplataforma do cliente Papo"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
thiserror = "2"
log = "0.4"
base64 = "0.22"

[dev-dependencies]
# PR7 feasibility qualification only. Turso is pinned to the exact 0.8
# prerelease because Android/native-dependency cleanup landed in the 0.8 line
# and this is the family Papo would realistically ship; the pin is deliberate,
# not a floating semver range.
#
# It is a dev-dependency on purpose: PR7 only proves the engine via test-only
# probes. Production `ClientDb` integration belongs to PR8, which will promote
# this dependency and deal with its packaging.
turso = { version = "=0.8.0-pre.12", default-features = false }
