[package]
name = "papo-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Núcleo multiplataforma do cliente Papo"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
thiserror = "2"
log = "0.4"
base64 = "0.22"
