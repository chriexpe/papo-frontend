[package]
name = "papo-call"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false
description = "UI-independent GStreamer WebRTC call engine for Papo clients"

[dependencies]
papo-sdk = { path = "../sdk/core" }
gstreamer = "0.24"
gstreamer-app = { version = "0.24", features = ["v1_20"] }
gstreamer-video = "0.24"
gstreamer-webrtc = { version = "0.24", features = ["v1_20"] }
gstreamer-sdp = "0.24"
gstreamer-rtp = { version = "0.24", features = ["v1_20"] }
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
