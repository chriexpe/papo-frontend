[package]
name = "papo-call"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "UI-independent GStreamer WebRTC call engine for Papo clients"

[dependencies]
papo-core = { path = "../papo-core" }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
gstreamer-webrtc = "0.24"
gstreamer-sdp = "0.24"
gstreamer-rtp = { version = "0.24", features = ["v1_20"] }
serde_json = "1"
log = "0.4"
