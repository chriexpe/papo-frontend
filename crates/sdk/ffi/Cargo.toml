[package]
name = "papo-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]
integration-proof = []
# Exposes FakeMediaFactory FFI controls exclusively for local JVM/Rust tests; disabled in release APKs.
test-support = ["papo-sdk/test-support"]

[[bin]]
name = "papo-sdk-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
papo-sdk-ui = { path = "../ui" }
papo-sdk = { path = "../core" }
uniffi = "=0.32.2"
thiserror = "2"
eyeball-im = "=0.9.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
papo-test-server = { path = "../test-server" }
papo-sdk = { path = "../core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
