[package]
name = "papo-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]
integration-proof = ["dep:eyeball-im"]

[[bin]]
name = "papo-sdk-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
papo-sdk-ui = { path = "../ui" }
uniffi = "=0.32.2"
thiserror = "2"
eyeball-im = { version = "=0.9.1", optional = true }

[lints]
workspace = true
