[package]
name = "papo-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
papo-api = { path = "../api" }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10.9"
thiserror = "2"
url = "2.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
