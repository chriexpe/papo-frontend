[package]
name = "papo-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[features]
# In-memory scriptable credential host for examples and integration tests, never a platform backend.
test-support = []

[dependencies]
papo-api = { path = "../api" }
# Share unchanged raw-history snapshot nodes using the existing UI dependency version.
imbl = "=7.0.2"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
# Durable operation identifiers use the existing UUID version with serde, without RNG.
uuid = { version = "1.26.1", features = ["serde"] }
# Public outgoing DTO serialization and subprocess credential handoff use compact bytes.
base64 = "0.22.1"
# Incremental staged-file upload streams reuse the locked bytes and futures-core versions.
bytes = "1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10.9"
thiserror = "2"
url = "2.5"
# Separate cookie-free provider/media transport; reuse the locked reqwest version.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The one image path (anonymizing, crop and turn, fixed-size uploads) reuses the locked decoders
# and encoders of papo-core's image dependency, with the same four formats and no others.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Random attachment names draw from the operating system, like the locked uuid and rand do.
getrandom = "0.3"
# Safe cross-platform allocated disk-byte measurement, including sparse SQLite files.
fs2 = "=0.4.3"

[dev-dependencies]
papo-test-server = { path = "../test-server" }
tempfile = "3"
proptest = "=1.12.0"
tokio = { version = "1", features = ["test-util"] }

[[example]]
name = "history"
required-features = ["test-support"]

[[example]]
name = "outgoing"
required-features = ["test-support"]

[[example]]
name = "media_cost"
required-features = ["test-support"]

[lints]
workspace = true
