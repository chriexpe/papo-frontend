[package]
name = "papo-sdk-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
papo-sdk = { path = "../core" }
eyeball-im = "=0.9.1"
futures-util = "0.3"
imbl = "=7.0.2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
papo-sdk = { path = "../core", features = ["test-support"] }
papo-test-server = { path = "../test-server" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "time"] }
# Reuse the locked release for deterministic snapshot/diff equivalence properties.
proptest = "=1.12.0"

[lints]
workspace = true
