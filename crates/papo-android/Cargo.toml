[package]
name = "papo-android"
version = "0.8.5"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "JNI presentation adapter for the native Android Compose client"

[lib]
name = "papo_compose"
crate-type = ["cdylib", "rlib"]

[dependencies]
papo-core = { path = "../papo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"
log = "0.4"
