[package]
name = "papo-desktop"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
description = "Papo desktop client on Rune, built on the Papo SDK"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "papo_desktop"
path = "src/lib.rs"

[[bin]]
name = "papo-desktop"
path = "src/main.rs"

[dependencies]
# Rune is pre-release and moves daily. It is pinned to one revision, the
# same as the workspace [patch] table: upstream `dev` plus Papo's fixes on
# the `papo` branch of chriexpe/rune.
rune = { git = "https://github.com/chriexpe/rune", rev = "4273827c62d1169ce7e3ced21f757fbcfd254d76" }
rune-i18n = { git = "https://github.com/chriexpe/rune", rev = "4273827c62d1169ce7e3ced21f757fbcfd254d76" }
papo-sdk = { path = "../sdk/core" }
# The rail's per-server badge aggregates (ServerListService::subscribe_badges).
papo-sdk-ui = { path = "../sdk/ui" }
# Reads that subscription's stream; the version the SDK locks.
futures-util = "0.3"
# Drives the SDK client's own runtime from the bridge thread; the locked version.
tokio = { version = "1", features = ["rt", "sync", "macros"] }
# The OS keyring: the Secret Service on a Linux host, the Secret portal inside
# Flatpak. Uses zbus 6, the version Rune already locks.
oo7 = { version = "0.7.2", default-features = false, features = ["tokio", "native_crypto"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
rune-i18n = { git = "https://github.com/chriexpe/rune", rev = "4273827c62d1169ce7e3ced21f757fbcfd254d76", features = ["codegen"] }

[dev-dependencies]
serde_json = "1"
papo-sdk = { path = "../sdk/core", features = ["test-support"] }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
