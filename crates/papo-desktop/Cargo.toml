[package]
name = "papo-desktop"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
description = "Papo desktop client on Rune, built on the Papo SDK"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "papo_desktop"
path = "src/lib.rs"

[[bin]]
name = "papo-desktop"
path = "src/main.rs"

[dependencies]
# Rune is pre-release and moves daily. It is pinned to one revision, the
# same as the workspace [patch] table: upstream `dev` plus Papo's fixes on
# the `papo` branch of chriexpe/rune.
# Rune's default features without `embedded-fonts`: the app registers its own
# fonts (src/fonts.rs), so Rune's copy of Inter would be dead weight.
rune = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef", default-features = false, features = [
    "accessibility",
    "dbus",
    "metal-backend",
    # The FileChooser portal on Linux (rfd on macOS and Windows), for
    # attaching files (docs/design.md §14.1).
    "native-file-dialog",
    "ogg-audio",
    "svg",
] }
rune-i18n = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef" }
papo-sdk = { path = "../sdk/core" }
# The rail's per-server badge aggregates (ServerListService::subscribe_badges).
papo-sdk-ui = { path = "../sdk/ui" }
# Reads that subscription's stream; the version the SDK locks.
futures-util = "0.3"
# Drives the SDK client's own runtime from the bridge thread, and the lifecycle
# thread's runtime (SIGTERM and SIGINT, the handoff's deadlines); the locked version.
tokio = { version = "1", features = ["rt", "sync", "macros", "signal", "time"] }
# The session and system buses: the single-instance name and handoff, logind's
# sleep signal and the network monitor. zbus 6, which Rune and oo7 already lock.
zbus = { version = "6.3", default-features = false, features = ["tokio", "proxy", "service"] }
# The OS keyring: the Secret Service on a Linux host, the Secret portal inside
# Flatpak. Uses zbus 6, the version Rune already locks.
oo7 = { version = "0.7.2", default-features = false, features = ["tokio", "native_crypto"] }
# The timeline's items and the SDK's diffs to them (papo_sdk_ui::TimelineUpdate),
# at the versions the SDK pins.
eyeball-im = "=0.9.1"
imbl = "=7.0.2"
# The system's time zone at each message's time, for its local day and minute;
# the version the SDK locks, with the clock for the local zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Jumbo emoji: a message's graphemes, and which of them draw as emoji, by
# the same Unicode properties Rune routes to the colour emoji font with; the
# versions and features Rune already locks.
unicode-segmentation = "1.13"
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Code blocks' syntax colours: Rune's highlighter, at Rune's revision.
rune-highlights = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef" }
# Liquid glass on the floating surfaces (`docs/design.md` §5): `Fx::lens` bends
# what is behind a pill at its rim. Rune's own effect layers, at Rune's pin.
rune-fx = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef" }
# Desktop OS notifications (`docs/design.md` §8, D9a): Flatpak Notification portal and
# `org.freedesktop.Notifications` on Linux, at Rune's pin.
rune-notify = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef" }
# The texture format of Rune's isolated layers, which the glass compositor
# names to rune-fx; the version Rune locks.
wgpu = { version = "30.0.1", default-features = false }
# "Use the system font": whether the desktop's font is installed, and the
# family the system resolves `system-ui` to. The version and features Rune's
# text stack already locks.
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
# Links' hosts, parsed as the SDK checks them (WHATWG URLs), for the
# open-link confirmation; the version the SDK locks.
url = "2.5"
# A sent message's local identity, unique per send (the outgoing queue
# rejects a reused one); the version the SDK locks, with its random IDs.
uuid = { version = "1.26.1", features = ["v4"] }
log = "0.4"
# Video and audio in messages (`docs/design.md` §14.5): the one GStreamer initialisation,
# decoded frames' colour and their NV12 packing, shared with calls (D11).
papo-call = { path = "../papo-call" }
# The playback pipelines themselves (`playback`), at the versions papo-call locks.
gstreamer = "0.24"
gstreamer-app = { version = "0.24", features = ["v1_20"] }
gstreamer-video = { version = "0.24", features = ["v1_20"] }
# Copy image puts a picture on the clipboard as PNG (`docs/design.md` §14.7): the locked
# decoder Rune and the SDK already use, for the off-thread decode and encode.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The Appearance settings as one JSON object under one settings key, so a
# change is one atomic write (`appearance/stored.rs`); the version Rune's
# prefs already lock.
serde_json = "1"
env_logger = "0.11"

# Provider players in WPE WebKit (`docs/design.md` §15.3), found when the app runs: the
# system's libWPEWebKit-2.0 is opened with libloading, so a machine without it builds and runs
# the same binary with players off (§15.7), and its display, view and toplevel are subclassed
# through GObject. All three are the versions Cargo.lock already holds (ash and GStreamer use
# them); Linux only, where WPE is the WebView.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
glib-sys = "0.21.5"
gobject-sys = "0.21.5"

[build-dependencies]
rune-i18n = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef", features = ["codegen"] }

[dev-dependencies]
papo-sdk = { path = "../sdk/core", features = ["test-support"] }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
