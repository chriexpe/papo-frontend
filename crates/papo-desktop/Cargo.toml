[package]
name = "papo-desktop"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
description = "Papo desktop client on GPUI Kit, built on the new Papo SDK"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "papo_desktop"
path = "src/lib.rs"

[[bin]]
name = "papo-desktop"
path = "src/main.rs"

[dependencies]
# GPUI Kit pins the GPUI Fast fork; never add a direct GPUI dependency.
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast", "test-support"] }
papo-sdk-ui = { path = "../sdk/ui", features = ["integration-proof"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
