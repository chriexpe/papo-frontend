[package]
name = "papo-call-proof"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[features]
rune-proof = ["dep:rune", "dep:gstreamer-video", "papo-call/benchmark-telemetry"]

[dependencies]
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = { version = "0.24", features = ["v1_18"], optional = true }
rune = { git = "https://github.com/chriexpe/rune", rev = "8d08c8c250828bd12c8aeb4147281506bd52ba35", optional = true }
log = "0.4"
papo-api = { path = "../../../crates/sdk/api" }
papo-call = { path = "../../../crates/papo-call" }
papo-sdk = { path = "../../../crates/sdk/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
