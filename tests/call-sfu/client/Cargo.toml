[package]
name = "papo-call-proof"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[features]
rune-proof = ["dep:rune", "papo-call/benchmark-telemetry"]

[dependencies]
gstreamer = "0.24"
gstreamer-app = "0.24"
rune = { git = "https://github.com/chriexpe/rune", rev = "7638f0a632b8f8c3132e22809d0de57eb479c0ef", optional = true }
log = "0.4"
papo-api = { path = "../../../crates/sdk/api" }
papo-call = { path = "../../../crates/papo-call" }
papo-sdk = { path = "../../../crates/sdk/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
